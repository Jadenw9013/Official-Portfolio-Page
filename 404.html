<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Jaden Wong</title>
<meta name="description" content="That page doesn't exist. Head back to jaden-wong.com." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0a0a" />
<link rel="icon" type="image/png" href="/assets/muscle.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0a; --ink:#f0ede8; --muted:#b0aca6; --accent:#e8c87a;
  --border-ui:#605f5d; --focus:var(--accent);
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'Geist Mono',ui-monospace,'Courier New',monospace;
  --t--1:.8125rem; --t-0:1rem; --t-6:3.8125rem; --t-8:6rem;
  --ls-caps:.12em; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-6:2rem; --sp-7:3rem;
  --gutter:clamp(1.25rem,5vw,4rem); --radius:2px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100svh;display:grid;place-content:center;
  padding-inline:var(--gutter);
  background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:var(--t-0);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
:where(a):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--radius);}
.code{
  font-size:var(--t--1);letter-spacing:var(--ls-caps);text-transform:uppercase;
  font-weight:500;color:var(--accent);margin-bottom:var(--sp-4);
}
h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(var(--t-6),9vw,var(--t-8));line-height:.95;letter-spacing:-.02em;
}
h1 em{font-style:italic;color:var(--accent);}
p{color:var(--muted);margin-top:var(--sp-4);max-width:46ch;}
.actions{display:flex;gap:var(--sp-4);margin-top:var(--sp-7);flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-6);
  font-size:var(--t--1);font-weight:500;letter-spacing:var(--ls-caps);
  text-transform:uppercase;text-decoration:none;border-radius:var(--radius);
  transition:background .2s,border-color .2s,color .2s;
}
.btn-primary{background:var(--accent);color:var(--bg);}
.btn-primary:hover{background:#f0d890;}
.btn-ghost{border:1px solid var(--border-ui);color:var(--muted);}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;}}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Nothing <em>here.</em></h1>
  <p>This page moved or never existed. The portfolio now lives on a single page — projects, experience, and contact are all there.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">Back home →</a>
    <a href="/#projects" class="btn btn-ghost">See the work</a>
  </div>
</main>
</body>
</html>
