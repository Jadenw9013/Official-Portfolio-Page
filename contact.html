<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact Jaden Wong — Get in touch for collaborations, opportunities, and projects." />
  <meta name="author" content="Jaden Wong" />
  <title>Contact — Jaden Wong</title>

  <link rel="icon" type="image/png" href="assets/muscle.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="container nav__inner">
      <a href="index.html" class="nav__brand" aria-label="Home">JW</a>
      <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <i class="bi bi-list"></i>
      </button>
      <ul id="nav-links" class="nav__links">
        <li><a href="index.html" class="nav__link">Home</a></li>
        <li><a href="index.html#about" class="nav__link">About</a></li>
        <li><a href="index.html#projects" class="nav__link">Projects</a></li>
        <li><a href="index.html#experience" class="nav__link">Experience</a></li>
        <li><a href="contact.html" class="nav__link active">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="section" style="padding-top: calc(80px + var(--space-3xl));">
      <div class="container container--narrow">
        <div class="section-header">
          <div style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: var(--color-accent-subtle); border-radius: var(--radius-md); color: var(--color-accent); font-size: 1.5rem; margin: 0 auto var(--space-md);">
            <i class="bi bi-envelope"></i>
          </div>
          <h1 class="section-title">Get in Touch</h1>
          <p class="text-secondary" style="margin-top: var(--space-sm); font-size: var(--fs-body-lg);">Let's work together!</p>
        </div>

        <div class="contact-form">
          <form id="contactForm" data-sb-form-api-token="API_TOKEN">
            <div class="form-group">
              <label for="name" class="form-label">Full name</label>
              <input class="form-input" id="name" type="text" placeholder="Enter your name..." data-sb-validations="required" />
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email address</label>
              <input class="form-input" id="email" type="email" placeholder="name@example.com" data-sb-validations="required,email" />
            </div>

            <div class="form-group">
              <label for="phone" class="form-label">Phone number</label>
              <input class="form-input" id="phone" type="tel" placeholder="(123) 456-7890" data-sb-validations="required" />
            </div>

            <div class="form-group">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-textarea" id="message" placeholder="Enter your message here..." data-sb-validations="required"></textarea>
            </div>

            <!-- Submit success message -->
            <div id="submitSuccessMessage" style="display: none;">
              <p style="text-align: center; color: var(--color-accent); font-weight: var(--fw-semibold);">Form submission successful!</p>
            </div>

            <!-- Submit error message -->
            <div id="submitErrorMessage" style="display: none;">
              <p style="text-align: center; color: #ef4444; font-weight: var(--fw-semibold);">Error sending message!</p>
            </div>

            <button class="btn btn--primary btn--lg" type="submit" id="submitButton" style="width: 100%;" disabled>Submit</button>
          </form>
        </div>

        <!-- Social links -->
        <div style="text-align: center; margin-top: var(--space-3xl);">
          <p class="text-secondary" style="margin-bottom: var(--space-md);">Or connect with me on</p>
          <div style="display: flex; justify-content: center; gap: var(--space-xl);">
            <a href="https://github.com/Jadenw9013" target="_blank" rel="noopener noreferrer" aria-label="GitHub" style="font-size: 1.5rem; color: var(--color-text-muted);"><i class="bi bi-github"></i></a>
            <a href="https://www.linkedin.com/in/jadenawong/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" style="font-size: 1.5rem; color: var(--color-text-muted);"><i class="bi bi-linkedin"></i></a>
            <a href="https://www.instagram.com/jaden.w0ng/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" style="font-size: 1.5rem; color: var(--color-text-muted);"><i class="bi bi-instagram"></i></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__copy">&copy; 2025 Jaden Wong</span>
      <div class="footer__links">
        <a href="https://github.com/Jadenw9013" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/jadenawong/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <button class="back-to-top" aria-label="Back to top"><i class="bi bi-chevron-up"></i></button>
  <script src="js/scripts.js"></script>
  <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
</body>
</html>
